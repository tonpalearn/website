// ──────────────────────────────────────────────
const PROMPTPAY_ID = '0939149397'; // ต้น's PromptPay (ชัยวัฒน์)

function generatePromptPayPayload(id, amount) {
  const tlv = (tag, value) => tag + String(value.length).padStart(2,'0') + value;
  const target = String(id).replace(/[^0-9]/g, '');
  let typeTag, target15;
  if (target.length === 13) {
    typeTag = '02'; target15 = target;
  } else if (target.length === 10) {
    typeTag = '01'; target15 = '0066' + target.substring(1);
  } else {
    return null;
  }
  let payload = '';
  payload += tlv('00', '01');
  payload += tlv('01', amount ? '12' : '11');
  payload += tlv('29', tlv('00', 'A000000677010111') + tlv(typeTag, target15));
  payload += tlv('53', '764');
  if (amount) payload += tlv('54', Number(amount).toFixed(2));
  payload += tlv('58', 'TH');
  payload += '6304';
  let crc = 0xFFFF;
  for (let i = 0; i < payload.length; i++) {
    crc ^= (payload.charCodeAt(i) << 8);
    for (let j = 0; j < 8; j++) {
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
      crc &= 0xFFFF;
    }
  }
  return payload + crc.toString(16).toUpperCase().padStart(4, '0');
}

function PromptPayQR({ amount, size = 200 }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!ref.current || typeof window.qrcode !== 'function') return;
    const payload = generatePromptPayPayload(PROMPTPAY_ID, amount);
    if (!payload) return;
    const qr = window.qrcode(0, 'M');
    qr.addData(payload);
    qr.make();
    ref.current.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 1, scalable: true });
    const svg = ref.current.querySelector('svg');
    if (svg) {
      svg.style.width = size + 'px';
      svg.style.height = size + 'px';
      svg.style.display = 'block';
      svg.style.background = '#fff';
      svg.style.borderRadius = '8px';
    }
  }, [amount, size]);
  return <div ref={ref} style={{ width: size, height: size, margin: '0 auto' }}/>;
}

// สถานะรอบเรียน — ใช้ร่วมกันทั้งการ์ด/รายละเอียด
// ──────────────────────────────────────────────
function cohortState(c) {
  const seats = c.seats_taken || 0;
  const minConfirm = c.min_to_confirm || 4;
  const maxSeats = c.max_seats || 10;
  const isConfirmed = c.status === 'confirmed' || c.status === 'full' || seats >= minConfirm;
  const isFull = seats >= maxSeats;
  const isCancelled = c.status === 'cancelled';
  const bookable = !isFull && !isCancelled;
  const ebActive = !!(c.early_bird_price_thb && c.early_bird_deadline && daysLeft(c.early_bird_deadline) > 0);
  const displayPrice = ebActive ? c.early_bird_price_thb : c.price_thb;
  return {
    seats, minConfirm, maxSeats, isConfirmed, isFull, isCancelled, bookable, ebActive, displayPrice,
    seatsToConfirm: Math.max(0, minConfirm - seats),
    seatsRemaining: Math.max(0, maxSeats - seats),
    progressPct: Math.min(100, (seats / minConfirm) * 100),
  };
}

function StatusChip({ st }) {
  if (st.isCancelled) return <span className="chip chip-red">ยกเลิกรอบ</span>;
  if (st.isFull)      return <span className="chip">เต็มแล้ว</span>;
  if (st.isConfirmed) return <span className="chip chip-teal"><span className="dot"/>เปิดสอนแน่นอน</span>;
  return <span className="chip chip-gold"><span className="dot dot-live"/>เปิดรับสมัคร</span>;
}

// ──────────────────────────────────────────────
// COHORT CARD — ปก → ชื่อ → วัน → ราคา → ที่นั่ง → ปุ่ม
// รายละเอียดทั้งหมดย้ายไปหน้า detail (กดปก/ชื่อ/ลิงก์)
// ──────────────────────────────────────────────
function CohortCard({ cohort, onBook, onDetail, index }) {
  const cardRef = React.useRef(null);
  const viewedRef = React.useRef(false);

  useEffect(() => {
    if (!cardRef.current) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting && !viewedRef.current) {
          viewedRef.current = true;
          track('cohort_view', { cohort_id: cohort.id, course_num: cohort.course_num });
          io.disconnect();
        }
      });
    }, { threshold: 0.4 });
    io.observe(cardRef.current);
    return () => io.disconnect();
  }, [cohort.id]);

  const st = cohortState(cohort);

  return (
    <div ref={cardRef}
         className={`panel overflow-hidden flex flex-col rise card-hover ${st.bookable ? 'card-open' : 'card-dim'}`}
         style={{animationDelay: `${Math.min(index,6)*70}ms`}}>
      <div className="cover cursor-pointer" onClick={() => onDetail(cohort)}
           style={cohort.cover_url ? { backgroundImage: `url(${cohort.cover_url})` } : {}}>
        {!cohort.cover_url && <div className="absolute inset-0 flex items-center justify-center text-5xl opacity-20">🎓</div>}
        <div className="absolute top-3 right-3"><StatusChip st={st}/></div>
        {st.ebActive && (
          <div className="absolute bottom-3 left-3">
            <span className="chip chip-red">🔥 Early Bird · เหลือ {daysLeft(cohort.early_bird_deadline)} วัน</span>
          </div>
        )}
      </div>

      <div className="p-5 flex-1 flex flex-col">
        <div className="eyebrow" style={{fontSize:10}}>{cohort.format_label} · {cohort.duration_hours} ชม.</div>
        <h3 onClick={() => onDetail(cohort)}
            className="f-head font-bold text-[17px] tx mt-1.5 leading-snug clamp2 cursor-pointer">
          {cohort.title || `Course ${cohort.course_num} · ${cohort.course_name}`}
        </h3>

        <div className="mt-3 text-[13.5px] tx2 flex items-center gap-2">
          <span>📅</span>
          <span className="font-semibold tx">{fmtDate(cohort.start_date)}</span>
          <span className="tx3">· {cohort.start_time} น.</span>
        </div>

        <div className="mt-4 flex items-baseline gap-2">
          {st.ebActive && cohort.early_bird_price_thb !== cohort.price_thb && (
            <span className="text-[13px] tx3 line-through">฿{fmtTHB(cohort.price_thb)}</span>
          )}
          <span className="f-head font-bold text-[26px] gold">฿{fmtTHB(st.displayPrice)}</span>
          {st.ebActive && <span className="text-[11.5px]" style={{color:'var(--red)'}}>ถึง {fmtDateShort(cohort.early_bird_deadline)}</span>}
        </div>

        <div className="mt-3">
          <div className="flex items-center justify-between text-[12px] mb-1.5">
            <span className="tx3">ที่นั่ง {st.seats}/{st.maxSeats}</span>
            <span className={st.isConfirmed ? 'teal font-semibold' : 'tx2'}>
              {st.isConfirmed
                ? (st.seatsRemaining > 0 ? `เหลือ ${st.seatsRemaining} ที่` : 'เต็ม')
                : `อีก ${st.seatsToConfirm} คน เปิดสอนแน่นอน`}
            </span>
          </div>
          <div className={`seat-bar ${st.isConfirmed ? 'seat-ok' : ''}`}>
            <div className="seat-fill" style={{ width: `${st.progressPct}%` }}/>
          </div>
        </div>

        <button onClick={() => onBook(cohort, st.displayPrice, st.ebActive)}
                disabled={!st.bookable}
                className="btn btn-primary w-full mt-5">
          {st.isFull ? 'เต็มแล้ว' : st.isCancelled ? 'ยกเลิกรอบ' : `จองที่นั่ง · ฿${fmtTHB(st.displayPrice)}`}
        </button>
        <button onClick={() => onDetail(cohort)}
                className="mt-2.5 text-[13px] tx2 hover:opacity-70 transition underline underline-offset-4 decoration-dotted">
          ดูรายละเอียดคอร์สแบบเต็ม
        </button>
      </div>
    </div>
  );
}

// PUBLIC TAB — รอบที่จองได้ขึ้นก่อนเสมอ
// ──────────────────────────────────────────────
function PublicTab({ cohorts, loading, onBook }) {
  const [filter, setFilter] = useState('all');
  const [detail, setDetail] = useState(null);

  const sorted = useMemo(() => {
    const weight = (c) => {
      const st = cohortState(c);
      if (st.bookable) return 0;
      if (st.isFull) return 1;
      return 2; // cancelled
    };
    return [...cohorts].sort((a,b) => weight(a) - weight(b) || new Date(a.start_date) - new Date(b.start_date));
  }, [cohorts]);

  const filtered = useMemo(() => {
    let f = sorted;
    if (filter === 'open') f = f.filter(c => cohortState(c).bookable);
    if (filter === 'confirmed') f = f.filter(c => c.status === 'confirmed');
    return f;
  }, [sorted, filter]);

  return (
    <section className="pb-14">
      <div className="max-w-6xl mx-auto px-4 sm:px-6">
        <div className="flex flex-wrap items-end justify-between gap-3 mb-5">
          <div>
            <h2 className="f-head font-bold text-xl tx">รอบเรียนที่กำลังเปิด</h2>
            <p className="text-[13px] tx3 mt-0.5">จองก่อนได้เลย · ครบขั้นต่ำแล้วเปิดสอนแน่นอน · ไม่ครบคืนเงินเต็ม</p>
          </div>
          <div className="seg" style={{padding:3}}>
            {[
              {k:'all', label:'ทั้งหมด'},
              {k:'open', label:'ยังจองได้'},
              {k:'confirmed', label:'เปิดสอนแน่นอน'},
            ].map(o => (
              <button key={o.k} onClick={() => setFilter(o.k)}
                      className={filter === o.k ? 'on' : ''}
                      style={{padding:'7px 14px', fontSize:12.5}}>{o.label}</button>
            ))}
          </div>
        </div>

        {loading ? (
          <div className="text-center py-14 tx3">กำลังโหลด…</div>
        ) : filtered.length === 0 ? (
          <div className="panel p-10 text-center">
            <div className="text-5xl mb-3">📭</div>
            <div className="f-head font-bold tx text-lg">ยังไม่มีรอบเปิดตอนนี้</div>
            <p className="text-sm tx2 mt-2 max-w-md mx-auto">ทักไลน์แจ้งความสนใจไว้ได้ — มีคนสนใจครบกลุ่ม ต้นจะเปิดรอบใหม่ให้ครับ</p>
            <a href="https://line.me/R/ti/p/@tonpalearn?msg=สนใจคอร์ส%20Public%20Class%20แจ้งเปิดรอบใหม่ด้วย"
               target="_blank" rel="noopener" className="btn btn-primary mt-5">💬 ทักไลน์แจ้งความสนใจ</a>
          </div>
        ) : (
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
            {filtered.map((c, i) => <CohortCard key={c.id} cohort={c} onBook={onBook} onDetail={setDetail} index={i}/>)}
          </div>
        )}

        {detail && <CohortDetailModal cohort={detail} onBook={onBook} onClose={() => setDetail(null)}/>}

        <div className="panel2 p-4 mt-8 text-[13px] tx2 flex items-center gap-3">
          <span className="text-2xl">🛡️</span>
          <div>
            <span className="font-semibold tx">การันตีคืนเงิน</span> — ถ้ารอบไม่ครบขั้นต่ำจนถึงกำหนด คืนเงินเต็ม 100% ทันที
          </div>
        </div>
      </div>
    </section>
  );
}

// BOOKING MODAL — 4 ขั้น (ข้อมูล → จ่าย → สลิป → สำเร็จ)
// ──────────────────────────────────────────────
function BookingModal({ payload, onClose }) {
  const [step, setStep] = useState(1);
  const [form, setForm] = useState({
    customer_name:'', customer_phone:'', customer_email:'', customer_company:'',
    num_attendees: 1,
  });
  const [slipFile, setSlipFile] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const [bookingNo, setBookingNo] = useState(null);
  const [slipStatus, setSlipStatus] = useState('none');
  const [error, setError] = useState('');

  useEffect(() => { track('modal_open', { mode: payload.mode, cohort_id: payload.cohort_id, course_num: payload.course_num }); }, []);
  useEffect(() => {
    if (step > 1) track('step_advance', { step, mode: payload.mode, cohort_id: payload.cohort_id, course_num: payload.course_num });
  }, [step]);

  const submit = async () => {
    setSubmitting(true); setError('');
    try {
      const now = new Date();
      const yymm = String(now.getFullYear()).slice(2) + String(now.getMonth()+1).padStart(2,'0');
      const rand = Math.floor(Math.random() * 9999).toString().padStart(4,'0');
      const booking_no = `BOOK-${yymm}-${rand}`;

      let slip_url = null;
      let slipWarning = null;
      if (slipFile) {
        const fileName = `${booking_no}-${Date.now()}.${slipFile.name.split('.').pop()}`;
        const { error: upErr } = await sb.storage.from('slips').upload(fileName, slipFile);
        if (upErr) {
          console.warn('Slip upload failed:', upErr.message);
          if (upErr.message?.toLowerCase().includes('bucket')) {
            slipWarning = 'storage_not_ready';
          } else {
            slipWarning = 'upload_failed';
          }
        } else {
          slip_url = fileName;
        }
      }

      const booking = {
        booking_no,
        status: slip_url ? 'slip_uploaded' : 'pending_payment',
        mode: payload.mode,
        customer_name: form.customer_name,
        customer_phone: form.customer_phone,
        customer_email: form.customer_email || null,
        customer_company: form.customer_company || null,
        course_num: payload.course_num,
        course_name: payload.course_name,
        format: payload.format,
        format_label: payload.format_label,
        hours: payload.hours,
        duration_hours: payload.duration_hours,
        num_attendees: form.num_attendees || 1,
        preferred_date: payload.preferred_date,
        preferred_time: payload.preferred_time,
        amount: payload.amount,
        payment_amount: payload.amount,
        is_early_bird: !!payload.is_early_bird,
        cohort_id: payload.cohort_id || null,
        slip_url,
        slip_uploaded_at: slip_url ? new Date().toISOString() : null,
      };

      const { error: insErr } = await sb.from('bookings').insert(booking);
      if (insErr) throw insErr;

      setBookingNo(booking_no);
      setSlipStatus(slip_url ? 'uploaded' : slipWarning || (slipFile ? 'upload_failed' : 'none'));
      track('submit_success', { mode: payload.mode, cohort_id: payload.cohort_id, course_num: payload.course_num, amount: payload.amount, has_slip: !!slip_url });
      setStep(4);
    } catch (e) {
      console.error(e);
      setError(e.message);
    } finally {
      setSubmitting(false);
    }
  };

  const STEPS = ['ข้อมูลผู้จอง','ชำระเงิน','แนบสลิป','สำเร็จ'];

  return (
    <div className="fixed inset-0 z-50 scrim flex items-start justify-center pt-10 px-4 pb-8 overflow-y-auto" onClick={onClose}>
      <div className="modal max-w-xl w-full" onClick={e => e.stopPropagation()}>
        <div className="px-5 py-4 border-b flex items-center justify-between" style={{borderColor:'var(--line)'}}>
          <div>
            <h2 className="f-head font-bold text-lg tx">{step === 4 ? '✓ จองสำเร็จ' : STEPS[step-1]}</h2>
            <div className="flex gap-1.5 mt-1.5">
              {STEPS.map((s, i) => (
                <div key={i} className="h-1 rounded-full transition-all"
                     style={{width: i < step ? 26 : 14, background: i < step ? 'var(--g2)' : 'var(--line2)'}}/>
              ))}
            </div>
          </div>
          <button onClick={onClose} className="btn btn-quiet" style={{padding:'6px 12px'}}>✕</button>
        </div>

        <div className="p-5 max-h-[72vh] overflow-y-auto scrollable">
          {step === 1 && (
            <div className="space-y-3.5">
              <div className="panel2 p-4 text-[13.5px]">
                <div className="font-semibold tx">{payload.course_name}</div>
                <div className="tx2 mt-1">{payload.format_label} · {payload.duration_hours || payload.hours} ชม. · <span className="gold font-bold">฿{fmtTHB(payload.amount)}</span></div>
                {payload.is_early_bird && <div className="mt-1" style={{color:'var(--red)'}}>🔥 ราคา Early Bird</div>}
                <div className="text-[12px] tx3 mt-1">📅 {fmtDate(payload.preferred_date)} · {payload.preferred_time} น.</div>
              </div>

              <div><label className="lbl">ชื่อ-สกุล *</label><input className="inp" value={form.customer_name} onChange={e => setForm({...form, customer_name: e.target.value})}/></div>
              <div><label className="lbl">เบอร์โทร *</label><input className="inp" value={form.customer_phone} onChange={e => setForm({...form, customer_phone: e.target.value})}/></div>
              <div><label className="lbl">Email</label><input className="inp" type="email" value={form.customer_email} onChange={e => setForm({...form, customer_email: e.target.value})}/></div>
              <div><label className="lbl">บริษัท (ถ้ามี)</label><input className="inp" value={form.customer_company} onChange={e => setForm({...form, customer_company: e.target.value})}/></div>

              <button onClick={() => setStep(2)} disabled={!form.customer_name || !form.customer_phone}
                      className="btn btn-primary w-full mt-2">
                ถัดไป · ชำระเงิน
              </button>
            </div>
          )}

          {step === 2 && (
            <div>
              <div className="text-sm tx2 mb-4 text-center">
                โอนเงิน <span className="f-head font-bold text-xl gold">฿{fmtTHB(payload.amount)}</span>
              </div>

              <div className="panel2 p-4 mb-3 text-center">
                <div className="eyebrow mb-2" style={{fontSize:10}}>PromptPay · สแกนจ่ายได้เลย</div>
                <div className="inline-block p-2 rounded-xl" style={{background:'#fff', border:'1px solid var(--line)'}}>
                  <PromptPayQR amount={payload.amount} size={200}/>
                </div>
                <div className="text-[12px] tx3 mt-2">ยอดเงินและผู้รับฝังใน QR แล้ว</div>
                <div className="text-[13px] tx mt-0.5 font-semibold">นาย ชัยวัฒน์ ภูวนนท์จิรกวิน</div>
              </div>

              <div className="panel2 p-4 mb-4 text-center">
                <div className="eyebrow mb-1" style={{fontSize:10}}>หรือโอนเข้าบัญชี · กสิกรไทย</div>
                <div className="f-mono font-bold text-xl gold">745-2-61376-4</div>
                <div className="text-[12.5px] tx2">ชัยวัฒน์ ภูวนนท์จิรกวิน</div>
              </div>

              <button onClick={() => setStep(3)} className="btn btn-primary w-full">โอนแล้ว · แนบสลิป</button>
              <button onClick={() => setStep(1)} className="btn btn-quiet w-full mt-2 text-[13px]">← กลับ</button>
            </div>
          )}

          {step === 3 && (
            <div>
              <div className="text-sm tx2 mb-3">แนบสลิปการโอน (JPG / PNG)</div>
              <input type="file" accept="image/*" onChange={e => setSlipFile(e.target.files?.[0])} className="inp"/>
              {slipFile && <div className="text-sm mt-2 teal">✓ {slipFile.name}</div>}
              {error && <div className="text-sm mt-2" style={{color:'var(--red)'}}>{error}</div>}
              <button onClick={submit} disabled={!slipFile || submitting} className="btn btn-primary w-full mt-4">
                {submitting ? 'กำลังบันทึก…' : 'ส่งใบจอง'}
              </button>
              <div className="text-[12px] tx3 mt-3 text-center">
                ส่งไม่ได้? <button onClick={submit} disabled={submitting} className="underline gold">ข้ามการแนบสลิป · ส่งภายหลัง</button>
              </div>
            </div>
          )}

          {step === 4 && (
            <div className="text-center py-4">
              <div className="text-5xl mb-3">🎉</div>
              <div className="f-head font-bold text-xl tx">จองสำเร็จแล้ว!</div>
              <div className="text-sm tx2 mt-2">เลขที่จอง: <span className="f-mono font-bold gold">{bookingNo}</span></div>
              <div className="text-[13px] tx2 mt-4 max-w-sm mx-auto">
                {payload.mode === 'public_cohort'
                  ? 'รอทีมงานตรวจการโอน · เมื่อครบขั้นต่ำ รอบจะยืนยันและแจ้งคุณทาง LINE'
                  : 'รอทีมงานตรวจการโอน · จะยืนยันเวลาเรียนภายใน 24 ชม.'}
              </div>

              {(slipStatus === 'storage_not_ready' || slipStatus === 'upload_failed') && (
                <div className="panel2 p-4 mt-4 text-left">
                  <div className="text-[13px] font-semibold tx mb-1">⚠️ สลิปยังไม่ได้อัปโหลด</div>
                  <div className="text-[12.5px] tx2 mb-2">
                    {slipStatus === 'storage_not_ready'
                      ? 'ระบบเก็บสลิปยังไม่พร้อม — ส่งสลิปทาง LINE พร้อมเลขจอง:'
                      : 'อัปโหลดสลิปไม่สำเร็จ — ส่งสลิปทาง LINE พร้อมเลขจอง:'}
                  </div>
                  <a href={`https://line.me/R/ti/p/@tonpalearn?msg=${encodeURIComponent('สลิปสำหรับเลขจอง ' + bookingNo)}`}
                     target="_blank" rel="noopener"
                     className="btn btn-primary w-full text-[13px]">💬 ส่งสลิปทาง LINE</a>
                </div>
              )}

              <div className="text-[12px] tx3 mt-4">สอบถามได้ที่ <a href="https://line.me/R/ti/p/@tonpalearn" target="_blank" rel="noopener" className="underline gold">LINE @tonpalearn</a></div>
              <button onClick={onClose} className="btn btn-primary mt-5">เสร็จสิ้น</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

  }, []);

    if (trackInited) track('tab_switch', { mode });
    const u = new URL(location.href);
    u.searchParams.set('mode', mode);
    history.replaceState(null, '', u);
  }, [mode]);

  useEffect(() => {
    (async () => {
      const { data } = await sb.from('public_cohorts').select('*')
        .eq('is_published', true)
        .gte('start_date', new Date().toISOString().slice(0,10))
        .order('start_date');
      setCohorts(data || []);
      setLoading(false);
    })();
  }, []);

  const openCount = useMemo(() => cohorts.filter(c => cohortState(c).bookable).length, [cohorts]);

  const handlePublicBook = (cohort, price, isEB) => {
    track('cohort_click', { cohort_id: cohort.id, course_num: cohort.course_num, price, is_early_bird: isEB });
    setBookingPayload({
      mode: 'public_cohort',
      cohort_id: cohort.id,
      course_num: cohort.course_num,
      course_name: cohort.title || cohort.course_name,
      format: cohort.format,
      format_label: cohort.format_label,
      hours: cohort.duration_hours,
      duration_hours: cohort.duration_hours,
      preferred_date: cohort.start_date,
      preferred_time: cohort.start_time,
      amount: price,
      is_early_bird: isEB,
    });
  };

  return (
    <>
      <Nav/>
      <Header mode={mode} setMode={setMode} openCount={openCount}/>
      {mode === 'public' ? (
        <PublicTab cohorts={cohorts} loading={loading} onBook={handlePublicBook}/>
      ) : (
        <PrivateTab onBook={(p) => { track('private_book_click', { course_num: p.course_num, format: p.format, amount: p.amount }); setBookingPayload(p); }}/>
      )}
      <ClassPhotos/>
      <Testimonials/>
      <Footer/>
      {bookingPayload && <BookingModal payload={bookingPayload} onClose={() => setBookingPayload(null)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
